# CI: 타입 검사·테스트·빌드는 여기서, VM 은 이미지만 실행한다 (DEC-011, NFR-05).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/diet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @diet/shared build
      - run: pnpm --filter @diet/api prisma:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: OpenAPI and client types are up to date
        run: |
          pnpm --filter @diet/api openapi:export
          pnpm --filter @diet/web api-types
          git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api-types.d.ts
      # 빈 DB 에 migrate deploy 가 되는지와 schema.prisma 와의 차이를 먼저 본다.
      # e2e(global-setup)는 이력 테이블 없이 SQL 을 직접 적용하므로 이 단계를 테스트 뒤에 두면 P3005 가 난다.
      - name: Migrations match schema
        run: |
          pnpm --filter @diet/api prisma:deploy
          pnpm --filter @diet/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  images:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # api·web 이미지는 독립이라 한쪽 실패로 다른 쪽을 취소하지 않는다
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/diet-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/diet-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
