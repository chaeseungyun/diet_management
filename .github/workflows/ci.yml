# CI: 타입 검사·테스트·빌드는 여기서, VM 은 이미지만 실행한다 (DEC-011, NFR-05).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/diet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @diet/shared build
      - run: pnpm --filter @diet/api prisma:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: OpenAPI and client types are up to date
        run: |
          pnpm --filter @diet/api openapi:export
          pnpm --filter @diet/web api-types
          git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api-types.d.ts
      # 빈 DB 에 migrate deploy 가 되는지와 schema.prisma 와의 차이를 먼저 본다.
      # e2e(global-setup)는 이력 테이블 없이 SQL 을 직접 적용하므로 이 단계를 테스트 뒤에 두면 P3005 가 난다.
      - name: Migrations match schema
        run: |
          pnpm --filter @diet/api prisma:deploy
          pnpm --filter @diet/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  images:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # api·web 이미지는 독립이라 한쪽 실패로 다른 쪽을 취소하지 않는다
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/diet-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/diet-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # CD (DEC-062): main 의 이미지가 올라가면 VM 에 SSH 로 들어가 같은 SHA 태그로 올린다.
  # 비밀(Settings → Secrets → Actions): DEPLOY_HOST(고정 IP), DEPLOY_USER(ubuntu),
  # DEPLOY_SSH_KEY(배포 전용 ed25519 개인키 전체), DEPLOY_HOST_KEY(`ssh-keyscan -t ed25519 <IP>` 결과 한 줄).
  # 롤백: 이전에 성공한 run 의 deploy job 을 Re-run 하거나, VM 에서 IMAGE_TAG=<이전 sha> 로 같은 명령을 친다.
  deploy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DOMAIN: kkinilog.com
    steps:
      - name: SSH 로 pull · up
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -euo pipefail
          cd ~/diet
          git pull --ff-only
          export API_IMAGE="ghcr.io/chaeseungyun/diet-api:$IMAGE_TAG"
          export WEB_IMAGE="ghcr.io/chaeseungyun/diet-web:$IMAGE_TAG"
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull api web
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --remove-orphans
          docker image prune -f >/dev/null
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env ps
          REMOTE
      - name: 헬스 확인
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://$DOMAIN/api/v1/health"
